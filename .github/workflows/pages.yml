# Publica la demo estática de ProgMesas en GitHub Pages en cada push a main.
# La demo corre en el navegador (demo/demo.js) con los datos de la base y de asignaciones.xlsx.
# Sólo se publica si pasan las pruebas de la API y las de la interfaz.

name: Demo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # En la raíz: instala también backend/ (postinstall)
      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas de la API
        run: npm test

      - name: Armar el sitio
        run: node demo/construir_sitio.js _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  interfaz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar el navegador
        run: npx playwright install --with-deps chromium

      - name: Pruebas de interfaz y accesibilidad
        run: npm run test:ui

  publicar:
    needs: [construir, interfaz]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
