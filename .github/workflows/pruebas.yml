# Corre las pruebas automáticas en cada push a otras ramas y en cada pull request.
# (En main las corre el workflow de la demo antes de publicar.)

name: Pruebas

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas de la API
        run: npm test

  interfaz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar el navegador
        run: npx playwright install --with-deps chromium

      - name: Pruebas de interfaz y accesibilidad
        run: npm run test:ui
